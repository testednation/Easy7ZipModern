name: Release

# Builds both installer variants on a version tag push (v1.2.3) and attaches
# them to the GitHub Release for that tag. Manually dispatchable as well.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} installer
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri "https://files.jrsoftware.org/is/6/innosetup-6.7.3.exe" -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\Inno Setup 6"

      - name: Stage payloads
        shell: pwsh
        run: |
          tools\stage-payload.ps1 `
            -Arch ${{ matrix.arch }} `
            -RepoRoot ${{ github.workspace }} `
            -PayloadRoot "$env:RUNNER_TEMP\installer" `
            -Version ("${{ github.ref_name }}" -replace '^v','')

      - name: Compile installer
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          & ISCC.exe installer\Easy7ZipModern-installer.iss `
            "/DArch=$arch" `
            "/DRepoRoot=${{ github.workspace }}" `
            "/DPayloadRoot=$env:RUNNER_TEMP\installer" `
            "/DAppVersion=$("${{ github.ref_name }}" -replace '^v','')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easy7ZipModern-setup-${{ matrix.arch }}
          path: ${{ runner.temp }}/installer/output/Easy7ZipModern-*-setup-${{ matrix.arch }}.exe
          if-no-files-found: error

  release:
    name: Attach installers to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*.exe
          generate_release_notes: true
